<script>
/* ================= utilidades ================= */
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const LS = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let TOKEN = LS.get('mf_token', ''), THEME = LS.get('mf_theme', 'auto'), URL_API = LS.get('mf_url', '');
const ES_ARCHIVO = location.protocol === 'file:' || /claude|anthropic|usercontent\.goog/.test(location.host);
const MODO = () => GAS ? 'gas' : URL_API ? 'web' : 'demo';
let DB = null, TAB = 'inicio', SUB = 'metas', PER = 'mes', CAL = null, charts = [], MQ = '', MF = 'todos';
const $ = s => document.querySelector(s);
const money = n => (n < 0 ? '-$' : '$') + Math.round(Math.abs(Number(n) || 0)).toLocaleString('es-MX');
const money2 = n => '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dias = (a, b) => Math.round((sod(a) - sod(b)) / 864e5);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DSEM = ['dom','lun','mar','mié','jue','vie','sáb'];
const fcorta = d => d.getDate() + ' ' + MES[d.getMonth()].slice(0, 3);
const flarga = d => DSEM[d.getDay()] + ' ' + d.getDate() + ' de ' + MES[d.getMonth()];
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (a, f = x => x.monto) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const lastFriday = d => addD(sod(d), -((d.getDay() - 5 + 7) % 7));
const enDias = n => n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n < 0 ? 'Hace ' + (-n) + ' d' : 'En ' + n + ' días';
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2300); }

/* ================= íconos ================= */
const ic = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  home: ic('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  chart: ic('<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>'),
  cal: ic('<rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>'),
  target: ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>'),
  back: ic('<path d="M15 18l-6-6 6-6"/>'),
  del: ic('<path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 5M12 9l5 5"/>'),
  check: ic('<path d="M20 6 9 17l-5-5"/>'),
  alert: ic('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'),
  ref: ic('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'),
  list: ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>')
};

/* ================= marcas, categorías y colores ================= */
const BRAND = [
  [/claude|anthropic/i, '#d97757', '✳'], [/chatgpt|openai/i, '#10a37f', '◎'], [/google ai|gemini/i, '#4f7cff', '✦'],
  [/fotos|photos/i, '#f4b400', '✿'], [/google/i, '#4285f4', 'G'], [/icloud|apple/i, '#3a8ee6', '☁'],
  [/netflix/i, '#e50914', 'N'], [/spotify/i, '#1db954', '♫'], [/youtube/i, '#ff0033', '▶'], [/disney/i, '#113ccf', 'D'],

function api(fn, ...a) {
  return new Promise((res, rej) => {
    if (MODO() === 'web') {
      fetch(URL_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, token: TOKEN, args: a }) })
        .then(r => r.json()).then(j => j.ok ? res(j.data) : rej(new Error(j.error))).catch(() => rej(new Error('Sin conexión con tu Google Sheet')));
      return;
    }
    if (!GAS) { try { res(DEMO[fn](...a)); } catch (e) { rej(e); } return; }
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](TOKEN, ...a);
  }).then(d => { if (d && d.movimientos) { DB = norm(d); render(); } return d; })
    .catch(e => { const m = (e && e.message) || String(e); if (/Token/.test(m)) { if (TOKEN) toast('⚠️ ' + m); pedirToken(); return; } toast('⚠️ ' + m); });
}
function norm(d) {
  d.movimientos.forEach(m => { m.monto = +m.monto || 0; });
  d.fijos.forEach(f => { f.monto = +f.monto || 0; f.dia = +f.dia || 0; });
  d.metas.forEach(m => { m.objetivo = +m.objetivo || 0; m.ahorrado = +m.ahorrado || 0; m.prioridad = +m.prioridad || 9; m.precio = +m.precio || 0; });
  d.deudas.forEach(x => { x.monto = +x.monto || 0; x.pendiente = +x.pendiente || 0; });
  return d;
}
const activos = () => DB.fijos.filter(f => f.activo !== 'no');
const esIng = f => f.tipo === 'ingreso';
const recurrentes = () => activos().filter(f => f.frecuencia === 'mensual' || f.frecuencia === 'bimestral');
const mensuales = () => recurrentes().filter(f => !esIng(f));      // pagos fijos (mensuales y cada 2 meses)
const ingresosFijos = () => recurrentes().filter(esIng);           // ej. Beca del Bienestar
const alMes = f => f.frecuencia === 'bimestral' ? f.monto / 2 : f.monto;
const FREQ = { mensual: 'Mensual', bimestral: 'Cada 2 meses', semanal: 'Presupuesto semanal' };
const semanales = () => activos().filter(f => f.frecuencia === 'semanal' && !esIng(f));
function ocurrencia(f, y, m) { return new Date(y, m, Math.min(f.dia || 1, dim(y, m))); }
function cubierto(f, occ) {
  const tp = esIng(f) ? 'ingreso' : 'gasto';
  return DB.movimientos.some(m => m.tipo === tp && (m.fuente === 'fijo:' + f.id || (esIng(f) && m.categoria === f.categoria)) && dias(pd(m.fecha), occ) >= -10 && dias(pd(m.fecha), occ) <= 20);
}
/** ¿Toca este mes? (los de cada 2 meses se cuentan desde su fecha "inicio") */
function tocaMes(f, y, m) {
  if (f.frecuencia !== 'bimestral') return true;
  const a = f.inicio ? pd(f.inicio) : new Date(y, m, 1);
  return (((y * 12 + m) - (a.getFullYear() * 12 + a.getMonth())) % 2 + 2) % 2 === 0;
}
/** Fechas de cobro (o de ingreso) entre dos fechas. Por defecto solo pagos; lista = qué fijos revisar */
function cobros(desde, hasta, lista) {
  const out = [];
  (lista || mensuales()).forEach(f => {
    for (let y = desde.getFullYear(), m = desde.getMonth() - 1; new Date(y, m, 1) <= hasta; m++) {
      if (!tocaMes(f, new Date(y, m, 1).getFullYear(), new Date(y, m, 1).getMonth())) continue;
      const o = ocurrencia(f, y, m);
      if (o >= sod(desde) && o <= hasta) out.push({ f, fecha: o, pagado: cubierto(f, o) });
    }
  });
  return out.sort((a, b) => a.fecha - b.fecha);
}
function calc() {
  const hoy = sod(new Date()), cfg = DB.config, M = DB.movimientos;
  const inicio = cfg.INICIO ? pd(cfg.INICIO) : addD(hoy, -365);
  const t = tp => sum(M.filter(m => m.tipo === tp));
  const balance = (+cfg.SALDO_INICIAL || 0) + t('ingreso') - t('gasto') - t('ahorro') + t('retiro_ahorro');
  const vie = lastFriday(hoy), sem = M.filter(m => pd(m.fecha) >= vie);
  const lista = cobros(addD(hoy, -25), addD(hoy, 31));
  const vencidos = lista.filter(x => x.fecha < hoy && x.fecha >= inicio && !x.pagado);
  const prox7 = lista.filter(x => x.fecha >= hoy && dias(x.fecha, hoy) <= 7 && !x.pagado);
  const sems = semanales().map(f => { const g = sum(sem.filter(m => m.tipo === 'gasto' && m.categoria === f.categoria)); return { ...f, gastado: g, resta: Math.max(0, f.monto - g) }; });
  const necesita = sum(vencidos, x => x.f.monto) + sum(prox7, x => x.f.monto) + sum(sems, x => x.resta);
  const colchon = +cfg.COLCHON || 0;
  const estado = balance >= necesita + colchon ? 'ok' : balance >= necesita ? 'warn' : 'bad';
  const didi = M.filter(m => m.tipo === 'ingreso' && m.categoria === 'Didi');
  const didiProm = didi.length ? sum(didi) / didi.length : 0;
  const ahorroSem = (t2 => t2 / 4)(sum(M.filter(m => m.tipo === 'ahorro' && pd(m.fecha) >= addD(hoy, -28)))) ;
  const mesG = M.filter(m => m.tipo === 'gasto' && pd(m.fecha).getMonth() === hoy.getMonth() && pd(m.fecha).getFullYear() === hoy.getFullYear());
  const gastoMes = sum(mesG);
  const proyMes = sum(mensuales(), alMes) + sum(semanales()) * 4.33;
  const proxIng = cobros(hoy, addD(hoy, 75), ingresosFijos()).filter(x => !x.pagado);
  const presupuesto = +cfg.PRESUPUESTO_MES || Math.round(proyMes);
  return {
    hoy, vie, balance, lista, proxIng, vencidos, prox7, sems, necesita, colchon, estado, didiProm, ahorroSem, gastoMes, proyMes, presupuesto,
    falta: Math.max(0, necesita - balance), libre: balance - necesita - colchon,
    ingSem: sum(sem.filter(m => m.tipo === 'ingreso')), gasSem: sum(sem.filter(m => m.tipo === 'gasto'))
  };
}
function consejos(c) {
  const t = [], metas = DB.metas.filter(m => m.ahorrado < m.objetivo).sort((a, b) => a.prioridad - b.prioridad);
  if (c.estado === 'bad') {
    t.push(['🛑', `Te faltan <b>${money(c.falta)}</b> para cubrir lo de los próximos 7 días. Frena los gustos hasta tu próximo pago.`]);
    t.push(['🏍', c.didiProm ? `Con unas <b>${Math.ceil(c.falta / c.didiProm)}</b> salida(s) de Didi lo cubres (promedias ${money(c.didiProm)}).` : 'Un par de tardes de Didi te ayudarían a cubrir lo que falta.']);
  } else if (c.estado === 'warn') t.push(['⚠️', 'Alcanzas, pero te quedas sin colchón. Evita gastos que no tengas planeados esta semana.']);
  else if (c.libre > 50 && metas[0]) t.push(['💪', `Te sobran <b>${money(c.libre)}</b>. Manda una parte a <b>${esc(metas[0].nombre)}</b>.`]);
  c.sems.filter(s => s.gastado > s.monto).forEach(s => t.push(['🔥', `Ya te pasaste <b>${money(s.gastado - s.monto)}</b> en ${esc(s.nombre)} esta semana.`]));
  return t;
}

function vCal(c) {

  const lista = cobros(new Date(y, m, 1), new Date(y, m, n), recurrentes());
  const deDia = d => lista.filter(x => x.fecha.getDate() === d);
  let cells = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<div class="h">${x}</div>`).join('') + '<div></div>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const dt = new Date(y, m, d), cls = ['cd'], xs = deDia(d);
    if (dt.getDay() === 5) cls.push('pay');
    if (dias(dt, c.hoy) === 0) cls.push('today');
    if (CAL.sel === d) cls.push('sel');
    if (xs.length) cls.push('has');
    cells += `<div class="${cls.join(' ')}" onclick="CAL.sel=${d};render()">${d}${xs.length ? `<span class="mk">${badge(xs[0].f.nombre, 18, xs[0].f.categoria)}</span>` : ''}${xs.length > 1 ? `<span class="n">${xs.length}</span>` : ''}</div>`;
  }
  const sd = CAL.sel ? new Date(y, m, CAL.sel) : null;

function rango(per, hoy) {

  if (per === 'sem') { const a = lastFriday(hoy); for (let d = new Date(a); d < fin; d = addD(d, 1)) b.push({ l: DSEM[d.getDay()], a: d, z: addD(d, 1) }); return { a, z: fin, b, t: 'esta semana de pago' }; }
  if (per === 'mes') { const a = new Date(hoy.getFullYear(), hoy.getMonth(), 1); for (let d = new Date(a); d < fin; d = addD(d, 7)) b.push({ l: fcorta(d), a: d, z: addD(d, 7) }); return { a, z: fin, b, t: MES[hoy.getMonth()] }; }
  if (per === '3m') { const a = addD(hoy, -90); for (let d = new Date(a); d < fin; d = addD(d, 7)) b.push({ l: fcorta(d), a: d, z: addD(d, 7) }); return { a, z: fin, b, t: 'últimos 3 meses' }; }
  const k = per === '6m' ? 6 : 12;
  for (let i = k - 1; i >= 0; i--) { const a = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1); b.push({ l: MES[a.getMonth()].slice(0, 3), a, z: new Date(a.getFullYear(), a.getMonth() + 1, 1) }); }
  return { a: b[0].a, z: fin, b, t: per === '6m' ? 'últimos 6 meses' : 'último año' };
}

function capKey(k) {
  let s = CAP.s;
  if (k === 'del') s = s.slice(0, -1);
  else if (k === '.') { if (!s.includes('.')) s = (s || '0') + '.'; }
  else { if (s.includes('.') && s.split('.')[1].length >= 2) return; if (s.replace('.', '').length >= 8) return; s = s === '0' ? k : s + k; }
  CAP.s = s; pintarAmt();
}

function form(titulo, campos, val, onOk, extra = '') {
  $('#sheet').className = 'sheet';
  $('#sheet').innerHTML = `<h2>${titulo}</h2>` + campos.map(f => {
    const v = val[f.k] ?? f.def ?? '';
    if (f.op) return `<label>${f.l}</label><select id="f_${f.k}">${f.op.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
    if (f.t === 'area') return `<label>${f.l}</label><textarea id="f_${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    return `<label>${f.l}</label><input id="f_${f.k}" type="${f.t || 'text'}" ${f.t === 'number' ? 'inputmode="decimal" step="any"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  }).join('') + `<div class="btns" style="margin-top:18px"><button class="btn" style="flex:1" id="okb">Guardar</button><button class="btn sec" onclick="cerrar()">Cancelar</button></div>${extra}`;
  $('#modal').classList.add('on');
  $('#okb').onclick = () => {
    const o = {};
    for (const f of campos) {
      let x = $('#f_' + f.k).value.trim();
      if (f.t === 'number') { x = parseFloat(x.replace(/[^\d.\-]/g, '')); if (isNaN(x)) x = 0; }
      if (f.req && !x) return toast('Completa: ' + f.l);

  };
}

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const reto = () => crypto.getRandomValues(new Uint8Array(32));
async function activarFaceID() {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: reto(), rp: { name: 'Bolsillo U', id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'bolsillo-u', displayName: 'Bolsillo U' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000 } });
    LS.set('mf_cred', b64(cred.rawId)); cerrar(); toast('🔐 Face ID activado');
  } catch (e) { toast('No se pudo activar Face ID'); }
}
async function desbloquear() {
  try {
    await navigator.credentials.get({ publicKey: { challenge: reto(), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: unb64(LS.get('mf_cred')) }], userVerification: 'required', timeout: 60000 } });
    $('#lock').classList.add('hidden'); arrancar();
  } catch (e) { toast('No se pudo verificar. Intenta de nuevo.'); }
}

    actualizarMetasApp: () => clone()
  };
})();

/* ================= arranque ================= */
aplicarTema();
function arrancar() {
  if (GAS || MODO() === 'web') return api('getData');
  if (ES_ARCHIVO) return verDemo();
  pedirToken(); // app publicada sin conectar todavía
}
if (MODO() === 'web' && LS.get('mf_cred') && window.PublicKeyCredential) { $('#lock').classList.remove('hidden'); desbloquear(); }
else arrancar();
</script>
